name: Scraper dry-run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

jobs:
  scraper:
    name: Generate import JSON
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r scripts/scraper/requirements.txt

      - name: Run scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/scraper/scraper.py

      - name: Validate output JSON
        run: python -m json.tool scripts/scraper/output.json > /tmp/output.json

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output-json
          path: scripts/scraper/output.json
          if-no-files-found: error
